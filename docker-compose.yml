version: '3.8'

services:
  discord-bot:
    build: .
    container_name: universal-discord-bot
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      # - DISCORD_TOKEN=seutokenaqui (Optional, you can also set it in Web UI)
      # - CLIENT_ID=oseuclientid
      # Sem WEB_AUTH_*, o primeiro arranque gera uma password do painel e mostra-a
      # nos logs do contentor (docker logs universal-discord-bot)
      # - WEB_AUTH_USERNAME=admin
      # - WEB_AUTH_PASSWORD=<defina-uma-senha-forte>  (só vale no primeiro arranque)
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
