version: '3.8'

services:
  discord-bot:
    build: .
    container_name: random-shit-discord-bot
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      # - DISCORD_TOKEN=seutokenaqui (Optional, you can also set it in Web UI)
